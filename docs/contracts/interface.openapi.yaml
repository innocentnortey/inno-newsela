  /lessons/{lessonId}/transitions:
    parameters:
      - $ref: '#/components/parameters/LessonId'
    post:
      tags: [approval]
      operationId: transitionLesson
      x-con: CON-18
      x-named-errors: [BLOCKED, CONFIRMATION_OPEN, SUGGESTION_PENDING, NOT_STORED, STALE_PIN, FOUR_EYES, RATING_REQUIRED, DEPENDENCY_UNAPPROVED, NOTE_REQUIRED, REASON_REQUIRED, INVALID_TRANSITION, COLLAB_UNAVAILABLE, ROLE_FORBIDDEN, NOT_FOUND]
      x-error-precedence: [ROLE_FORBIDDEN, NOT_FOUND, INVALID_TRANSITION, NOTE_REQUIRED, REASON_REQUIRED, RATING_REQUIRED, NOT_STORED, STALE_PIN, FOUR_EYES, SUGGESTION_PENDING, BLOCKED, CONFIRMATION_OPEN, DEPENDENCY_UNAPPROVED]
      summary: One lesson, one move (start review, submit, withdraw, approve, request changes, reopen)
      description: |
        One lesson per call; no bulk approve. Submit runs the collaboration server's internal freeze (lock, store
        at once, state-vector cover check → NOT_STORED, checks re-run, snapshot + state + audit in one
        transaction, broadcast read_only; SP-2 confirms, close-all-connections fallback). Approve pins the
        snapshot's hash and state vector, re-runs the blocking checks on the snapshot, and returns 409 STALE_PIN on
        any mismatch with no change. Only a reviewer's start_review starts a review (UXP-1, UXQ-11); only an
        approver reopens (UXP-4); tags per UXP-6; withdraw needs no reason (UXP-10). BLOCKED wins over
        CONFIRMATION_OPEN and lists both kinds in details.issues. Moves that freeze or unfreeze the document return
        COLLAB_UNAVAILABLE when the collaboration server cannot be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
            examples:
              approveLesson5:
                value:
                  action: approve
                  snapshot_hash: c300000000000000000000000000000000000000000000000000000000000501
                  snapshot_state_vector: AQLE9qQEBwA=
                  rating: usable_with_edits
      responses:
        '200':
          description: The move is done; Submit, Approve and Reopen write an immutable snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionResult' }
              examples:
                lesson5Approved:
                  value:
                    lesson_id: G6.U4.L5
                    from_state: submitted
                    to_state: approved
                    version: { version_id: lv-5-2, version_number: 2, content_hash: c300000000000000000000000000000000000000000000000000000000000501, state_vector: AQLE9qQEBwA= }
                    audit_id: aud-0150
                    dependency_record: []
                    metrics_row_written: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '400': { $ref: '#/components/responses/BadRequest' }

