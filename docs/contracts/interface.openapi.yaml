x-collaboration-channel:
  x-con: CON-12
  status: agreed
  summary: One authenticated Yjs websocket per lesson, served by one Hocuspocus process (PD-9). Not REST.
  transport: websocket (Hocuspocus protocol over y-protocols)
  document_name: 'lesson:<lesson_id>, e.g. lesson:G6.U4.L4'
  authentication: The app session from CON-1 (the ls_session cookie on the upgrade request, checked against the same Postgres session row). An unauthenticated connection or an unknown email is refused (R-26, R-54). Sign-out closes that session's sockets [A].
  document_shape:
    sections: One Y.XmlFragment per section, in the shared ProseMirror node schema (HP-4).
    front_matter: One Y.Map in the same Y.Doc, bound to the form fields (standards, minutes) (HP-4).
  awareness: Each co-editor's name and cursor.
  write_permission: Reviewer connections only, and only while the lesson is in_review, changes_requested or reopened. Decided at the System review from HP-5 (the approver never edits) and R-54; authors read only. Every other connection is read-only.
  server_messages:
    stored:
      description: A Hocuspocus stateless message sent after each durable store. The client uses it to clear "saving" and to allow Submit.
      fields: { type: stored, content_hash: 64 hex characters, state_vector: base64, stored_at: date-time }
    refused:
      description: Sent to the typist when a write is refused. Nothing persists.
      fields: { type: refused, code: LESSON_LOCKED, message: plain words, refused_from: base64 state vector before the refused updates }
    mode:
      description: Sent when the lesson freezes (Submit, Approve) or unfreezes (Withdraw, Request changes, Reopen).
      fields: { type: mode, mode: editable | read_only, state: lesson state }
  client_states: [connecting, synced, saving, stored, DISCONNECTED, read_only]
  named_errors:
    UNAUTHENTICATED: The connection is refused.
    LESSON_LOCKED: A write to a lesson that is not editable, or from a non-reviewer connection. Nothing persists; the typist is told.
    DISCONNECTED: Channel state. Local edits are held; Submit is off until a stored message covers them (UXP-7, from HP-4 and HP-5). On reconnect held edits are resent; if the lesson froze meanwhile they come back as refused.
  internal_calls:
    description: Private calls from the web app to this process (never exposed outside the Compose network), each applied as one Yjs transaction attributed to the named person and stored at once. If unreachable, the HTTP operation returns COLLAB_UNAVAILABLE and nothing changes.
    used_by: [decideStandard (CON-14), fillSlot (CON-15), adoptCandidate (CON-16), decideSuggestion accept (CON-17), transitionLesson submit/withdraw/request_changes/reopen (CON-18)]
  freeze_at_submit: Lock the document (refuse every later update before applying it), store at once, check that the submitter's state vector is covered by the stored one (else NOT_STORED), re-run the blocking checks on the stored row, write the snapshot, state change and audit row in one transaction, broadcast mode read_only. Confirmed by SP-2. Fallback if SP-2 fails — close every connection to the document at the lock; clients reconnect within 10 s, receive mode read_only, and any held edit not in the snapshot is reported refused. Same promise either way.
  guarantees:
    - Only the collaboration server writes lesson content (R-26, HP-4).
    - Each durable store writes, in one Postgres transaction, the Y.Doc bytes, the derived Lesson JSON, its SHA-256, the state vector and one coalesced check_job row for the worker (R-26, HP-4, DO-1 D-6).
    - Round trip JSON → Y.Doc → JSON keeps the hash (HP-4; confirmed by SP-2).
    - The last editor is the user on the connection whose update was last stored, including AI accepts, candidate adoption and standard decisions (R-33, HP-5).
    - After a lock, 0 edits persist; every keystroke is either in the snapshot or reported refused to its typist (HP-5).
  timing:
    store_debounce: ≤ 2 s [T] (R-26)
    store_transaction_p95: ≤ 500 ms [T] (HP-4; SP-2)
    remote_edit_visible_p95: < 500 ms [T] at the 200-user spike (R-56 as amended, PD-33; cut 1)
    durably_stored_p95: < 3 s [T] (R-56, cut 1)
    reconnect: within 10 s [T] (capacity doc)
  system_review: Claude (System track, Opus), 2026-10-25 — agreed. The stored message is a stateless message; the Submit lock is an internal freeze call; write roles decided; timing at PD-33 targets.

x-common-errors: [UNAUTHENTICATED, INVALID_REQUEST, SERVICE_BUSY]

