        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ls_session
      description: The app session from CON-1 — an opaque token in an HttpOnly, SameSite=Strict cookie, held server-side in Postgres, so the socket (CON-12) checks the same session. Mutating requests are refused unless Origin is the app's own.

  parameters:
    OutlineVersionId:
      name: outlineVersionId
      in: path
      required: true
      description: An outline version, e.g. G6.U4.ov1.
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      description: A run (opaque id; run-0001 is illustrative).
      schema: { type: string }
    UnitId:
      name: unitId
      in: path
      required: true
      description: A unit, as the canonical id (G6.U4) or the readable key (g6-u4) (UXQ-2).
      schema: { type: string }
    LessonId:
      name: lessonId
      in: path
      required: true
      description: A lesson, as the canonical id (G6.U4.L4, G6.U4.FLEX-1a) or <unit_key>:<lesson_key> (g6-u4:L4) (UXQ-2).
      schema: { type: string }
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: A candidate version (opaque id; cand-4-2 is illustrative).
      schema: { type: string }

  responses:
    BadRequest:
      description: INVALID_REQUEST — the body or a parameter breaks the schema; details.fields names each. Nothing changes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidRequest:
              value: { error: { code: INVALID_REQUEST, message: Some fields need attention., details: { fields: [lesson_id] } } }
    Unauthenticated:
      description: No valid session (UNAUTHENTICATED).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unauthenticated:
              value: { error: { code: UNAUTHENTICATED, message: Please sign in., details: {} } }
    Forbidden:
      description: The role may not do this (ROLE_FORBIDDEN), or the email is not on the allow-list (NOT_ON_ALLOW_LIST). Nothing changes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            roleForbidden:
              value: { error: { code: ROLE_FORBIDDEN, message: Only approvers can approve., details: { required_role: approver } } }
    NotFound:
      description: No such unit, version, run, lesson or item.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notFound:
              value: { error: { code: NOT_FOUND, message: No such lesson., details: {} } }
    Conflict:
      description: STALE_PIN, LESSON_LOCKED, ANCHOR_CHANGED, NOT_STORED, INVALID_TRANSITION, UNDO_EXPIRED or STALE_BASE. Nothing changes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            stalePin:
              value: { error: { code: STALE_PIN, message: This lesson changed since you opened it. Reload., details: { pinned_hash: 9f00000000000000000000000000000000000000000000000000000000000405, current_hash: 9f00000000000000000000000000000000000000000000000000000000000406 } } }
    Unprocessable:
      description: A named business refusal (e.g. BLOCKED, VALIDATION_INCOMPLETE, SOURCE_REQUIRED, INVALID_CHOICE, NOT_RESOLVABLE). Nothing changes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            dependencyUnapproved:
              value: { error: { code: DEPENDENCY_UNAPPROVED, message: Lesson 5 must be approved first., details: { lesson_id: G6.U4.L5 } } }
    Unavailable:
      description: MODEL_UNAVAILABLE, COLLAB_UNAVAILABLE or SERVICE_BUSY. Nothing changed; retry is safe. SERVICE_BUSY carries Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (SERVICE_BUSY).
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            serviceBusy:
              value: { error: { code: SERVICE_BUSY, message: Busy for a moment; trying again., details: { retry_after_seconds: 2 } } }
            model:
              value: { error: { code: MODEL_UNAVAILABLE, message: "Couldn't get a suggestion; nothing changed.", details: {} } }
            collab:
              value: { error: { code: COLLAB_UNAVAILABLE, message: Couldn't save that change; nothing changed. Trying again., details: {} } }
    BadGateway:
      description: SHEET_UNREACHABLE — Google Sheets did not answer within 10 s. Nothing stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            sheetUnreachable:
              value: { error: { code: SHEET_UNREACHABLE, message: "Couldn't reach Google Sheets. Try again, or upload the file.", details: {} } }
    SchemaUnknown:
      description: SCHEMA_UNKNOWN — the stored lesson's schema_version is unknown; the lesson is not opened and nothing is dropped.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            schemaUnknown:
              value: { error: { code: SCHEMA_UNKNOWN, message: 'Lesson G6.U4.L4 uses schema version 3, which this build cannot read.', details: { lesson_id: G6.U4.L4, schema_version: 3 } } }

  schemas:
    ErrorCode:
      type: string
      description: The named errors from INTERFACE.md; x-error-catalog gives each one's HTTP status. DISCONNECTED is a channel state on CON-12, not an HTTP code.
      enum:
        - INVALID_REQUEST
        - INVALID_CREDENTIALS
        - INVALID_CHOICE
        - NOT_RESOLVABLE
        - UNDO_EXPIRED
        - STALE_BASE
        - SHEET_UNREACHABLE
        - COLLAB_UNAVAILABLE
        - SERVICE_BUSY
        - UNAUTHENTICATED
        - NOT_ON_ALLOW_LIST
        - ROLE_FORBIDDEN
        - NOT_FOUND
        - INVALID_TRANSITION
        - SHEET_NOT_PUBLIC
        - UNSUPPORTED_FILE
        - HEADER_NOT_FOUND
        - TOO_MANY_ROWS
        - VALIDATION_INCOMPLETE
        - DAY_CAP_REACHED
        - SCHEMA_UNKNOWN
        - LESSON_LOCKED
        - REASON_REQUIRED
        - NOTE_REQUIRED
        - SOURCE_REQUIRED
        - QUOTE_TOO_LONG
        - ANCHOR_CHANGED
        - MODEL_UNAVAILABLE
        - BLOCKED
        - CONFIRMATION_OPEN
        - SUGGESTION_PENDING
        - NOT_STORED
        - STALE_PIN
        - FOUR_EYES
        - RATING_REQUIRED
        - DEPENDENCY_UNAPPROVED
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Plain words the screen may show. }
            details: { type: object, additionalProperties: true }

    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    StateVector:
      type: string
      description: A Yjs state vector, base64.
    Timestamp:
      type: string
      format: date-time
    NullableText:
      type: [string, 'null']

    Role:
      type: string
      enum: [author, reviewer, approver]
    User:
      type: object
      required: [user_id, name, email, role, synthetic]
      properties:
        user_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        synthetic: { type: boolean, description: An account Claude or a load script drives; excluded from NS and G-2 (HP-8). }
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
    Session:
      type: object
      required: [user, expires_at]
      properties:
        user: { $ref: '#/components/schemas/User' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }

    RowCounts:
      type: object
      required: [lessons, flex_days, arc_headers, total_rows]
      properties:
        lessons: { type: integer }
        flex_days: { type: integer }
        arc_headers: { type: integer }
        total_rows: { type: integer }
    OutlineVersion:
      type: object
      required: [outline_version_id, unit_id, unit_key, version_number, sha256, same_as_version, changed_lessons, row_counts, created_at, created_by]
      properties:
        outline_version_id: { type: string }
        unit_id: { type: string }
        unit_key: { type: string, description: 'Readable URL key, e.g. g6-u4 (UXQ-2).' }
        version_number: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        same_as_version: { type: [integer, 'null'] }
        changed_lessons: { type: integer }
        row_counts: { $ref: '#/components/schemas/RowCounts' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        created_by: { type: string }
    RunRef:
      type: object
      required: [run_id, state]
      properties:
        run_id: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
    Unit:
      type: object
      required: [unit_id, unit_key, title, versions, latest_run]
      properties:
        unit_id: { type: string }
        unit_key: { type: string }
        title: { type: string }
        versions: { type: array, items: { $ref: '#/components/schemas/OutlineVersion' } }
        latest_run:
          oneOf:
            - $ref: '#/components/schemas/RunRef'
            - type: 'null'
    UnitList:
      type: object
      required: [units]
      properties:
        units: { type: array, items: { $ref: '#/components/schemas/Unit' } }
    ImportLinkRequest:
      type: object
      required: [sheet_url]
      properties:
        sheet_url: { type: string, format: uri }

    ChoiceRecord:
      type: object
      required: [value, source, by, at]
      properties:
        value: { $ref: '#/components/schemas/NullableText' }
        source: { type: string, enum: [default, confirmed] }
        by: { $ref: '#/components/schemas/NullableText' }
        at: { type: [string, 'null'], format: date-time }
    Finding:
      type: object
      required: [finding_id, level, kind, column, original_text, proposed_fix, choice]
      properties:
        finding_id: { type: string }
        level: { type: string, enum: [info, warning, error] }
        kind:
          type: string
          description: 'Errors block Generate: malformed_code, nonexistent_code, unit_conflict, duplicate_id, missing_required_column. A new kind is a CHG.'
          enum: [malformed_code, nonexistent_code, unit_conflict, duplicate_id, missing_required_column, parent_code, bad_filename, eld_mismatch, eld_not_checked, vocabulary_over_cap, vocabulary_word_missing, homework_links_later_row, non_breaking_space, duplicate_text, instruction_shaped, safety_note_proposed, writer_task]
        column: { type: string }
        original_text: { type: string }
        proposed_fix: { $ref: '#/components/schemas/NullableText' }
        choice: { $ref: '#/components/schemas/ChoiceRecord' }
    SegmentKind:
      type: string
      enum: [content, writer_task, editor_note, unit_rule, safety_note]
    Segment:
      type: object
      required: [segment_id, column, kind, text, action, source, by]
      properties:
        segment_id: { type: string }
        column: { type: string }
        kind: { $ref: '#/components/schemas/SegmentKind' }
        text: { type: string, description: 'Plain text, never markup (R-58).' }
        action: { type: [string, 'null'], enum: [apply, show_only, ignore, null], description: For notes only; default apply (HP-6). }
        source: { type: string, enum: [default, confirmed] }
        by: { $ref: '#/components/schemas/NullableText' }
    EldEntry:
      type: object
      required: [code, sheet_label, official_strand, verdict, suggested_remap, choice]
      properties:
        code: { type: string }
        sheet_label: { type: string }
        official_strand: { type: string }
        verdict: { type: string, enum: [fits, mismatch, not_checked] }
        suggested_remap: { $ref: '#/components/schemas/NullableText' }
        choice: { type: string, enum: [keep, remap] }
    ReportRow:
      type: object
      required: [row_number, kind, lesson_id, level, findings, segments, eld, flags]
      properties:
        row_number: { type: integer }
        kind: { type: string, enum: [lesson, flex_day, arc_header, total] }
        lesson_id: { $ref: '#/components/schemas/NullableText' }
        level: { type: string, enum: [ok, info, warning, error] }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        segments: { type: array, items: { $ref: '#/components/schemas/Segment' } }
        eld: { type: array, items: { $ref: '#/components/schemas/EldEntry' } }
        flags: { type: array, items: { type: string, description: 'e.g. instruction_shaped (kept as content).' } }
    ReportCounts:
      type: object
      required: [teaching_days, lessons, flex_days, arc_headers, total_rows, errors, errors_unconfirmed, warnings, unit_conflicts, malformed_codes, rows_with_nonexistent_code, bad_filenames, eld_mismatches]
      properties:
        teaching_days: { type: integer }
        lessons: { type: integer }
        flex_days: { type: integer }
        arc_headers: { type: integer }
        total_rows: { type: integer }
        errors: { type: integer }
        errors_unconfirmed: { type: integer }
        warnings: { type: integer }
        unit_conflicts: { type: integer }
        malformed_codes: { type: integer }
        rows_with_nonexistent_code: { type: integer }
        bad_filenames: { type: integer }
        eld_mismatches: { type: integer }
    UnitRule:
      type: object
      required: [text, scope_rows, source]
      properties:
        text: { type: string }
        scope_rows: { type: array, items: { type: integer } }
        source: { type: string, enum: [default, confirmed] }
    ValidationReport:
      type: object
      required: [outline_version_id, version_number, sha256, same_as_version, unit, counts, rows, unit_rules, runs_from_this_version, generate_allowed]
      properties:
        outline_version_id: { type: string }
        version_number: { type: integer }
        sha256: { $ref: '#/components/schemas/Sha256' }
        same_as_version: { type: [integer, 'null'] }
        unit:
          type: object
          required: [as_written, filenames_say, confirmed, confirmed_by]
          properties:
            as_written: { type: string }
            filenames_say: { $ref: '#/components/schemas/NullableText' }
            confirmed: { type: boolean }
            confirmed_by: { $ref: '#/components/schemas/NullableText' }
        counts: { $ref: '#/components/schemas/ReportCounts' }
        rows: { type: array, items: { $ref: '#/components/schemas/ReportRow' } }
        unit_rules: { type: array, items: { $ref: '#/components/schemas/UnitRule' } }
        runs_from_this_version:
          type: array
          description: Runs started from this version, newest first (UXQ-9); each pinned the choice set named by choices_hash.
          items:
            type: object
            required: [run_id, started_at, choices_hash]
            properties:
              run_id: { type: string }
              started_at: { $ref: '#/components/schemas/Timestamp' }
              choices_hash: { $ref: '#/components/schemas/Sha256' }
        generate_allowed: { type: boolean, description: True only when errors_unconfirmed is 0 (R-5). }
    IntakeChoiceRequest:
      type: object
      required: [target_id, kind]
      properties:
        target_id: { type: string, description: 'A finding, segment or ELD entry.' }
        kind:
          type: string
          enum: [confirm_unit, confirm_fix, edit_fix, set_note_action, change_split, set_unit_rule_scope, eld_keep, eld_remap, confirm_safety_note, reject_safety_note, revert]
        value:
          description: Text or a list, depending on the kind.
          oneOf:
            - type: string
            - type: array
              items: { type: [string, integer] }
            - type: 'null'
    IntakeChoiceResult:
      type: object
      required: [row, counts, generate_allowed]
      properties:
        row: { $ref: '#/components/schemas/ReportRow' }
        counts: { $ref: '#/components/schemas/ReportCounts' }
        generate_allowed: { type: boolean }

    RunState:
      type: string
      enum: [planning, running, complete, partial, capped, paused, cancelled]
    TileState:
      type: string
      enum: [queued, planning, drafting, checking, repairing, ready, failed]
    RunScope:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [all, rows, unfinished_of_run], description: 'unfinished_of_run finishes a capped or partial run with a new cap (UXP-5).' }
        rows: { type: array, items: { type: integer }, description: 'Row numbers, when kind is rows.' }
        run_id: { type: string, description: 'The earlier run, when kind is unfinished_of_run.' }
    StartRunRequest:
      type: object
      required: [outline_version_id, mode, scope, prompt_version_id, cap_usd]
      properties:
        outline_version_id: { type: string }
        mode: { type: string, enum: [run, trial], description: A trial writes a candidate for one lesson (R-39). }
        scope: { $ref: '#/components/schemas/RunScope' }
        lesson_id: { type: [string, 'null'], description: Trial only. }
        prompt_version_id: { type: string, description: One locked layer plus one guidance version. }
        cap_usd: { type: number, exclusiveMinimum: 0 }
    Run:
      type: object
      required: [run_id, state, mode, scope, outline_version_id, prompt_version_id, choices_hash, cap_usd, spent_usd, created_by, created_at]
      properties:
        run_id: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        mode: { type: string, enum: [run, trial] }
        scope: { $ref: '#/components/schemas/RunScope' }
        outline_version_id: { type: string }
        prompt_version_id: { type: string }
        choices_hash: { $ref: '#/components/schemas/Sha256' }
        cap_usd: { type: number }
        spent_usd: { type: number }
        created_by: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    FailureReason:
      type: object
      required: [check, message]
      properties:
        check:
          type: string
          enum: [schema_invalid, truncated, rate_limited, provider_error, timeout, compile_error, check_failed, cancelled, capped]
        check_kind: { type: [string, 'null'], description: 'The CON-13 issue kind, when check is check_failed.' }
        message: { type: string }
    Tile:
      type: object
      required: [lesson_id, lesson_key, number, title, tile_state, attempts, repair_used, truncation_retry_used, failure_reasons, cost_usd, openable]
      properties:
        lesson_id: { type: string }
        lesson_key: { type: string }
        number: { type: [integer, 'null'] }
        title: { type: string }
        tile_state: { $ref: '#/components/schemas/TileState' }
        attempts: { type: integer }
        repair_used: { type: boolean }
        truncation_retry_used: { type: boolean }
        failure_reasons: { type: array, items: { $ref: '#/components/schemas/FailureReason' } }
        cost_usd: { type: number }
        openable: { type: boolean }
    RunProgress:
      type: object
      required: [run_id, state, paused_reason, capped_by, spent_usd, reserved_usd, cap_usd, concurrency_cap, queued_ahead, counts_by_tile_state, updated_at, tiles]
      properties:
        run_id: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        paused_reason:
          oneOf:
            - type: object
              required: [check, lesson_ids]
              properties:
                check: { type: string }
                lesson_ids: { type: array, items: { type: string } }
            - type: 'null'
        capped_by: { type: [string, 'null'], enum: [run_cap, day_cap, project_cap, null] }
        spent_usd: { type: number }
        reserved_usd: { type: number }
        cap_usd: { type: number }
        concurrency_cap: { type: integer }
        queued_ahead: { type: integer, description: Jobs from other runs ahead of this run's next queued job. }
        counts_by_tile_state:
          type: object
          additionalProperties: { type: integer }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        tiles: { type: array, items: { $ref: '#/components/schemas/Tile' } }
    RunControlRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [cancel, retry_failed, resume], description: 'No raise-the-cap action (UXP-5, decided).' }
    RunControlResult:
      type: object
      required: [run_id, state, requeued_lessons]
      properties:
        run_id: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        requeued_lessons: { type: array, items: { type: string } }
    PlanEntry:
      type: object
      required: [lesson_id, day, purpose, routines, hands_forward, performance_task_thread]
      properties:
        lesson_id: { type: string }
        day: { type: integer }
        purpose: { type: string }
        routines: { type: array, items: { type: string } }
        hands_forward: { type: string }
        performance_task_thread: { type: string }
    LessonLink:
      type: object
      required: [link_id, from_lesson_id, from_address, to_lesson_id, to_slot_id, label]
      properties:
        link_id: { type: string }
        from_lesson_id: { type: string }
        from_address: { type: string }
        to_lesson_id: { type: string }
        to_slot_id: { type: string }
        label: { type: string }
    UnitPlan:
      type: object
      required: [run_id, state, stored_at, entries, lesson_links]
      properties:
        run_id: { type: string }
        state: { type: string, enum: [planning, stored, failed], description: failed means the plan call failed and the run is paused (Resume retries). }
        stored_at: { type: [string, 'null'], format: date-time }
        entries: { type: array, items: { $ref: '#/components/schemas/PlanEntry' } }
        lesson_links: { type: array, items: { $ref: '#/components/schemas/LessonLink' }, description: 'Computed by code at intake, never by the model (HP-1).' }
    RunSummary:
      type: object
      required: [run_id, state, n, wall_time_seconds, cost_usd, cost_per_ready_lesson_usd, lessons, retries, failures_by_reason, placeholders_left, calls_lost_in_flight, brakes_fired, truncation_retries, p95_minutes_per_lesson, target_minutes_per_lesson, report_path]
      properties:
        run_id: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        n: { type: integer }
        wall_time_seconds: { type: integer }
        cost_usd: { type: number }
        cost_per_ready_lesson_usd: { type: [number, 'null'], description: 'Total cost ÷ ready lessons (a mean per successful lesson, GP-107); null when none is ready.' }
        lessons:
          type: object
          required: [ready, failed]
          properties:
            ready: { type: integer }
            failed: { type: integer }
        retries: { type: integer }
        failures_by_reason:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { type: string }
              count: { type: integer }
        placeholders_left: { type: integer }
        calls_lost_in_flight: { type: integer }
        brakes_fired:
          type: array
          items:
            type: object
            required: [brake, count]
            properties:
              brake: { type: string }
              count: { type: integer }
        truncation_retries: { type: integer }
        p95_minutes_per_lesson: { type: [number, 'null'] }
        target_minutes_per_lesson: { type: number }
        report_path: { $ref: '#/components/schemas/NullableText' }

    LessonState:
      type: string
      enum: [generation_failed, draft, in_review, submitted, changes_requested, approved, reopened, exported]
    SendBackTag:
      type: string
      description: The send-back tags (UXP-6, decided).
      enum: [standards, quotes_and_rights, eld_support, content_safety, ai_spans, teaching_quality, other]
    SendBack:
      type: object
      required: [tag, note, by, at]
      properties:
        tag: { $ref: '#/components/schemas/SendBackTag' }
        note: { type: string }
        by: { type: string }
        at: { $ref: '#/components/schemas/Timestamp' }
    DependencyFlag:
      type: object
      required: [kind, status, lesson_id, label]
      properties:
        kind: { type: string, enum: [waits_on, source_reopened] }
        status: { type: [string, 'null'], enum: [slot_empty, waiting_for_source_approval, null], description: 'For waits_on (UXP-2); null for source_reopened.' }
        lesson_id: { type: string }
        label: { type: string }
    BoardRow:
      type: object
      required: [lesson_id, lesson_key, number, title, type, state, blocking_count, confirmation_count, advisory_count, reviewer, last_change_at, dependency_flags, send_back, judge_flag]
      properties:
        lesson_id: { type: string }
        lesson_key: { type: string }
        number: { type: [integer, 'null'] }
        title: { type: string }
        type: { type: string }
        state: { $ref: '#/components/schemas/LessonState' }
        blocking_count: { type: integer }
        confirmation_count: { type: integer }
        advisory_count: { type: integer }
        reviewer: { $ref: '#/components/schemas/NullableText' }
        last_change_at: { $ref: '#/components/schemas/Timestamp' }
        dependency_flags: { type: array, items: { $ref: '#/components/schemas/DependencyFlag' } }
        send_back:
          oneOf:
            - $ref: '#/components/schemas/SendBack'
            - type: 'null'
        judge_flag:
          description: Only if the judge is built (cut 2); labelled provisional, not expert.
          oneOf:
            - type: object
              required: [verdict, label]
              properties:
                verdict: { type: string, enum: ['no'] }
                label: { type: string }
            - type: 'null'
    UnitBoard:
      type: object
      required: [unit_id, unit_key, generated_at, rollup, rows]
      properties:
        unit_id: { type: string }
        unit_key: { type: string }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        rollup:
          type: object
          additionalProperties: { type: integer }
        rows: { type: array, items: { $ref: '#/components/schemas/BoardRow' } }

    UnitMetrics:
      type: object
      required: [north_star, quality]
      properties:
        north_star:
          type: object
          required: [median_minutes, n, fast_approvals, approved, caption, segment_label]
          properties:
            median_minutes: { type: [number, 'null'] }
            n: { type: integer }
            fast_approvals:
              type: object
              required: [count, of]
              properties:
                count: { type: integer }
                of: { type: integer }
            approved:
              type: object
              required: [k, total]
              properties:
                k: { type: integer }
                total: { type: integer }
            caption: { type: string }
            segment_label: { $ref: '#/components/schemas/NullableText' }
        quality:
          description: Only if R-50 is built (cut 6); null when cut, never an empty object.
          oneOf:
            - type: object
              required: [tiles, rating_counts, seeded_errors]
              properties:
                tiles:
                  type: array
                  items:
                    type: object
                    required: [id, value, n, label]
                    properties:
                      id: { type: string }
                      value: { type: [number, 'null'] }
                      n: { type: integer }
                      label: { type: string }
                rating_counts:
                  type: object
                  required: [usable_as_drafted, usable_with_edits, rewritten, n]
                  properties:
                    usable_as_drafted: { type: integer }
                    usable_with_edits: { type: integer }
                    rewritten: { type: integer }
                    n: { type: integer }
                seeded_errors:
                  type: object
                  required: [planted, caught, label]
                  properties:
                    planted: { type: integer }
                    caught: { type: integer }
                    label: { type: string }
            - type: 'null'

    ProseMirrorDoc:
      type: object
      description: ProseMirror JSON in the one shared node schema module (HP-4 addendum). Its node types are defined by the Zod Lesson schema, not repeated here.
      required: [type]
      properties:
        type: { type: string, const: doc }
        content: { type: array, items: { type: object } }
      additionalProperties: true
    Standard:
      type: object
      required: [code, role, origin, official_text, asserted_by, confirmation]
      properties:
        code: { type: string }
        role: { type: string, enum: [focus, supporting, eld] }
        origin: { type: string, enum: [outline, outline-fixed, narrowed, added] }
        official_text: { type: string, description: Official CDE text only (GR-5). }
        asserted_by: { type: string, enum: [outline, generator, judge, reviewer] }
        confirmation: { type: [string, 'null'], enum: [open, confirmed, removed, null] }
    Section:
      type: object
      required: [address, name, minutes, content]
      properties:
        address: { type: string, description: 'e.g. G6.U4.L4.LearningInAction.PartA (R-21).' }
        name: { type: string }
        minutes: { type: integer }
        content: { $ref: '#/components/schemas/ProseMirrorDoc' }
    RightsStatus:
      type: string
      enum: [public-domain, Newsela-owned, licensed, to-clear, short-quote-commentary]
    TextCard:
      type: object
      required: [title, author, edition_or_isbn, chapter, pages, kind, rights_status]
      properties:
        title: { type: string }
        author: { $ref: '#/components/schemas/NullableText' }
        edition_or_isbn: { $ref: '#/components/schemas/NullableText' }
        chapter: { $ref: '#/components/schemas/NullableText' }
        pages: { $ref: '#/components/schemas/NullableText' }
        kind: { type: string, enum: [off-platform-text, newsela-reference, excerpt] }
        rights_status:
          oneOf:
            - $ref: '#/components/schemas/RightsStatus'
            - type: 'null'
    AlignmentEntry:
      type: object
      required: [code, teach_links, check_links, link_role, asserted_by]
      properties:
        code: { type: string }
        teach_links: { type: array, items: { type: string } }
        check_links: { type: array, items: { type: string } }
        link_role: { type: string, enum: [I, P, A] }
        asserted_by: { type: string, enum: [outline, generator, judge, reviewer] }
    ChecklistItem:
      type: object
      required: [key, label, status, evidence_refs]
      properties:
        key: { type: string, enum: [standards, quotes_and_rights, eld_support, content_safety, ai_spans, dependencies] }
        label: { type: string }
        status: { type: string, enum: [ok, open] }
        evidence_refs: { type: array, items: { type: string } }
    Dependency:
      type: object
      required: [direction, lesson_id, slot_id, status]
      properties:
        direction: { type: string, enum: [waits_on, depended_on_by] }
        lesson_id: { type: string }
        slot_id: { type: string }
        status: { type: string, enum: [slot_empty, waiting_for_source_approval, source_approved, source_reopened] }
    SnapshotRef:
      type: object
      required: [version_id, content_hash, state_vector]
      properties:
        version_id: { type: string }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        state_vector: { $ref: '#/components/schemas/StateVector' }
    Lesson:
      type: object
      required: [lesson_id, lesson_key, unit_id, number, title, type, state, version_number, content_hash, state_vector, schema_version, last_editor, snapshot, front_matter, sections, text_cards, outline_row, alignment_map, reviewer, send_back, checklist, dependencies, allowed_actions]
      properties:
        lesson_id: { type: string }
        lesson_key: { type: string, description: 'L4, or F1…F6 for flex days (UXQ-2).' }
        unit_id: { type: string }
        number: { type: [integer, 'null'] }
        title: { type: string }
        type: { type: string }
        state: { $ref: '#/components/schemas/LessonState' }
        version_number: { type: integer }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        state_vector: { $ref: '#/components/schemas/StateVector' }
        schema_version: { type: integer }
        last_editor: { $ref: '#/components/schemas/NullableText' }
        snapshot:
          description: For submitted and later; the values Approve must send back.
          oneOf:
            - $ref: '#/components/schemas/SnapshotRef'
            - type: 'null'
        front_matter:
          type: object
          required: [standards]
          properties:
            standards: { type: array, items: { $ref: '#/components/schemas/Standard' } }
          additionalProperties: true
        sections: { type: array, items: { $ref: '#/components/schemas/Section' } }
        text_cards: { type: array, items: { $ref: '#/components/schemas/TextCard' } }
        outline_row:
          type: object
          required: [row_number, segments]
          properties:
            row_number: { type: integer }
            segments: { type: array, items: { $ref: '#/components/schemas/Segment' } }
        alignment_map: { type: array, items: { $ref: '#/components/schemas/AlignmentEntry' } }
        reviewer: { $ref: '#/components/schemas/NullableText' }
        send_back:
          oneOf:
            - $ref: '#/components/schemas/SendBack'
            - type: 'null'
        checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        allowed_actions: { type: array, items: { type: string }, description: A hint for the screen; the server still decides. }

    IssueLevel:
      type: string
      enum: [blocking, confirmation, advisory]
    Issue:
      type: object
      required: [issue_id, level, blocks, resolvable, kind, message, address, span_anchor, related_lesson_id, resolution]
      properties:
        issue_id: { type: string }
        level: { $ref: '#/components/schemas/IssueLevel' }
        blocks: { type: array, items: { type: string, enum: [submit, approve] }, description: 'What this issue stops; empty for advisory. A filled-but-unapproved cross_lesson_link blocks approve only (UXP-2).' }
        resolvable: { type: boolean, description: Whether recordResolution may clear it (CON-13 resolvable kinds). }
        kind:
          type: string
          description: The System owns the full list of check kinds.
