x-collaboration-channel:
  x-con: CON-12
  status: proposed
  summary: One authenticated Yjs websocket per lesson, served by one Hocuspocus process (PD-9). Not REST.
  transport: websocket (Hocuspocus protocol over y-protocols)
  document_name: 'lesson:<lesson_id>, e.g. lesson:G6.U4.L4'
  authentication: The app session from CON-1. An unauthenticated connection or an unknown email is refused (R-26, R-54).
  document_shape:
    sections: One Y.XmlFragment per section, in the shared ProseMirror node schema (HP-4).
    front_matter: One Y.Map in the same Y.Doc, bound to the form fields (standards, minutes) (HP-4).
  awareness: Each co-editor's name and cursor.
  write_permission: Reviewer connections only, and only while the lesson is in_review, changes_requested or reopened [A]. Every other connection is read-only.
  server_messages:
    stored:
      description: Sent after each durable store. The client uses it to clear "saving" and to allow Submit.
      fields: { content_hash: 64 hex characters, state_vector: base64, stored_at: date-time }
    refused:
      description: Sent to the typist when a write is refused. Nothing persists.
      fields: { code: LESSON_LOCKED, message: plain words }
    mode:
      description: Sent when the lesson freezes (Submit, Approve) or unfreezes (Withdraw, Request changes, Reopen).
      fields: { mode: editable | read_only, state: lesson state }
  client_states: [connecting, synced, saving, stored, DISCONNECTED, read_only]
  named_errors:
    UNAUTHENTICATED: The connection is refused.
    LESSON_LOCKED: A write to a frozen or approved lesson. Nothing persists; the typist is told.
    DISCONNECTED: Channel state. Local edits are held; Submit is off until a stored message covers them (UXP-7, from HP-4 and HP-5).
  guarantees:
    - Only the collaboration server writes lesson content (R-26, HP-4).
    - Each durable store writes, in one Postgres transaction, the Y.Doc bytes, the derived Lesson JSON, its SHA-256 and the state vector (R-26, HP-4).
    - The last editor is the user on the connection whose update was last stored, including AI accepts and candidate adoption (R-33, HP-5).
    - After a lock, 0 edits persist; every keystroke is either in the snapshot or reported refused to its typist (HP-5).
  timing:
    store_debounce: ≤ 2 s [T] (R-26)
    store_transaction_p95: ≤ 500 ms [T] (HP-4)
    remote_edit_visible_p95: < 300 ms [T] (R-56, cut 1)
    durably_stored_p95: < 3 s [T] (R-56, cut 1)
  system_review_must_confirm:
    - The stored message as a Hocuspocus stateless message.
    - How the Submit lock reaches the collaboration process (HP-5 reason 3), and the SP-2 fallback (close all connections at Submit).
    - The write-permission assumption above.
