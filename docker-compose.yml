# Newsela Lesson Studio stack: postgres, a one-shot migrate, worker, collab and web.
# Run (provider keys come from the shared file, passed by name only; never copied into .env):
#   /home/linuxuser/workspaces/bin/with-provider-env --project-env .env -- docker compose up --build --wait
# `with-provider-env --check` shows key status without values.
# Two database credentials: MIGRATE_DATABASE_URL is the owner and only the one-shot `migrate` service holds it.
# DATABASE_URL is the non-owner runtime role (no UPDATE/DELETE/TRUNCATE on append-only tables); `migrate`
# creates/refreshes it through scripts/apply-runtime-grants.mjs. Postgres is not published here;
# docker-compose.test.yml adds the loopback test port.
# Required variables (compose stops and names the variable when one is unset), written below as a
# line-split quoted expansion: ${COLLAB_INTERNAL_TOKEN:?set it}, ${AUDIT_HASH_SALT:?set it}, ${DATABASE_URL:?set it}.
name: ls
x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.node
    args:
      BUILD_ID: ${BUILD_ID:-dev}
  image: ls-node
  networks: [ls_net]
x-node-healthcheck: &probe
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 15s
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ls
      ? POSTGRES_PASSWORD
      : "${POSTGRES_PASSWORD\
          :-ls_dev_only}"
      POSTGRES_DB: ls
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [ls_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ls"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *node
    command: ["true"]
    restart: "no"
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      RUNTIME_DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
  # Local demo only (profile "seed", never started by `up`): loads standards, prompt v1 and the three documented demo
  # accounts the sign-in box shows. SEED_ALLOW_DEMO_ACCOUNTS is set here and nowhere else (never on Render).
  # Run: docker compose --profile seed run --rm seed
  seed:
    <<: *node
    profiles: [seed]
    command: ["node_modules/.bin/tsx", "ops/seed.ts"]
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
      SEED_ALLOW_DEMO_ACCOUNTS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *node
    command: ["node_modules/.bin/tsx", "apps/worker/src/main.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ? AUDIT_HASH_SALT
      : "${AUDIT_HASH_SALT\
          :?set AUDIT_HASH_SALT}"
      ? COLLAB_INTERNAL_TOKEN
      : "${COLLAB_INTERNAL_TOKEN\
          :?set COLLAB_INTERNAL_TOKEN}"
      MODEL_PROVIDER_MODE: ${MODEL_PROVIDER_MODE:-stub}
      WORKER_HEALTH_PORT: "8081"
      BUILD_ID: ${BUILD_ID:-dev}
      ANTHROPIC_API_KEY:
      OPENROUTER_API_KEY:
    healthcheck:
      <<: *probe
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.WORKER_HEALTH_PORT+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  collab:
    <<: *node
    command: ["node_modules/.bin/tsx", "apps/collab/src/main.ts"]
    ports:
      - "127.0.0.1:${COLLAB_PORT:-1234}:1234"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ? AUDIT_HASH_SALT
      : "${AUDIT_HASH_SALT\
          :?set AUDIT_HASH_SALT}"
      ? COLLAB_INTERNAL_TOKEN
      : "${COLLAB_INTERNAL_TOKEN\
          :?set COLLAB_INTERNAL_TOKEN}"
      COLLAB_PORT: "1234"
      BUILD_ID: ${BUILD_ID:-dev}
    healthcheck:
      <<: *probe
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BUILD_ID: ${BUILD_ID:-dev}
        # Public URL, baked into the browser bundle at build time (changing COLLAB_PORT needs --build).
        NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL:-ws://localhost:${COLLAB_PORT:-1234}}
    image: ls-web
    networks: [ls_net]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ? AUDIT_HASH_SALT
      : "${AUDIT_HASH_SALT\
          :?set AUDIT_HASH_SALT}"
      ? COLLAB_INTERNAL_TOKEN
      : "${COLLAB_INTERNAL_TOKEN\
          :?set COLLAB_INTERNAL_TOKEN}"
      COLLAB_INTERNAL_URL: ${COLLAB_INTERNAL_URL:-http://collab:1234/internal}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      MODEL_PROVIDER_MODE: ${MODEL_PROVIDER_MODE:-stub}
      # Shows the three demo accounts on the sign-in page (Compose demo only, not Render).
      DEMO_ACCOUNTS: "1"
      BUILD_ID: ${BUILD_ID:-dev}
      ANTHROPIC_API_KEY:
      OPENROUTER_API_KEY:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
networks:
  ls_net: {}
volumes:
  pg_data:
